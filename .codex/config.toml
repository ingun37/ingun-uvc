# Uses the project environment installed from ocr/requirements.txt:
# paddleocr_mcp==0.8.5 and paddleocr==3.7.0.
# Update these absolute paths if the checkout moves.
[mcp_servers.paddleocr]
command = "/Users/ingunjon/projects/ingun-uvc/ocr/.venv/bin/python"
args = ["-m", "paddleocr_mcp"]
cwd = "/Users/ingunjon/projects/ingun-uvc/ocr"
startup_timeout_sec = 120
tool_timeout_sec = 600

[mcp_servers.paddleocr.env]
PADDLEOCR_MCP_MODEL = "PP-OCRv6"
PADDLEOCR_MCP_PPOCR_SOURCE = "local"
PADDLEOCR_MCP_DEVICE = "cpu"
PADDLE_PDX_CACHE_HOME = "/Users/ingunjon/projects/ingun-uvc/ocr/.cache/paddlex"
